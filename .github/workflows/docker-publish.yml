name: Docker

on:
  push:
    # Only trigger on version tags (releases)
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  IMAGE_NAME: tkgreg/kan
  MIGRATE_IMAGE_NAME: tkgreg/kan-migrate

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build each platform natively on its own runner (no QEMU) and push
  # by digest; the merge job below assembles the multi-arch manifests.
  # https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      # Platform string with / replaced by - for artifact names and cache scopes
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up BuildKit Docker container builder to be able to
      # export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # https://github.com/docker/login-action
      - name: Log in to Docker Hub
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels only — tags are applied when the manifests are merged
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Extract Docker metadata (migrate)
        id: meta-migrate
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.MIGRATE_IMAGE_NAME }}

      # Extract version from git tag or ref
      # Uses git describe to get latest tag + commit hash in SemVer format: 1.2.3+abc1234
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
          else
            # Use git describe and simplify: v1.2.3-5-gabc1234 -> 1.2.3+abc1234
            GIT_DESCRIBE=$(git describe --tags --always --long 2>/dev/null || echo "")
            if [[ -n "$GIT_DESCRIBE" ]]; then
              # Match pattern: v1.2.3-5-gabc1234 (tag-commits-gcommit)
              if [[ "$GIT_DESCRIBE" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+-g([a-f0-9]+)$ ]]; then
                # Format as tag+commit (SemVer build metadata)
                TAG_VERSION="${BASH_REMATCH[1]}"
                COMMIT_HASH="${BASH_REMATCH[2]}"
                VERSION="${TAG_VERSION}+${COMMIT_HASH:0:7}"
              elif [[ "$GIT_DESCRIBE" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                # Exactly on a tag
                VERSION="${BASH_REMATCH[1]}"
              else
                # Fallback: just commit hash
                COMMIT_SHA="${{ github.sha }}"
                VERSION="${COMMIT_SHA:0:7}"
              fi
            else
              # No tags exist, use commit hash
              COMMIT_SHA="${{ github.sha }}"
              VERSION="${COMMIT_SHA:0:7}"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # https://github.com/docker/build-push-action
      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Build and push migrate Docker image by digest
        id: build-migrate
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: apps/web/Dockerfile
          target: migrate
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.MIGRATE_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=migrate-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=migrate-${{ env.PLATFORM_PAIR }}

      - name: Export digests
        run: |
          mkdir -p /tmp/digests/app /tmp/digests/migrate
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/app/${digest#sha256:}"
          digest="${{ steps.build-migrate.outputs.digest }}"
          touch "/tmp/digests/migrate/${digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the per-platform digests into one multi-arch manifest per image
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Extract Docker metadata (migrate)
        id: meta-migrate
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.MIGRATE_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests/app
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$METADATA_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Create manifest list and push (migrate)
        working-directory: /tmp/digests/migrate
        env:
          METADATA_JSON: ${{ steps.meta-migrate.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$METADATA_JSON") \
            $(printf '${{ env.MIGRATE_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect images
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          docker buildx imagetools inspect ${{ env.MIGRATE_IMAGE_NAME }}:${{ steps.meta-migrate.outputs.version }}
